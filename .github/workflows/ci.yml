# CI del monorepo.
#
# Vive en la RAÍZ a propósito. Hasta el 2026-07-29 el único workflow estaba en
# `athos-service/.github/workflows/ci.yml`, pero GitHub Actions sólo lee `.github/workflows/` del
# raíz del repositorio y `athos-service/` no es un repo propio: ese workflow nunca se registró, así
# que los 140 tests del backend y los 186 del front NO corrían en ningún push ni PR (hallazgo §7.1
# de la auditoría del Milestone 2).
#
# Cada job filtra por `paths` para no correr el backend cuando sólo cambió el front y al revés.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# Un push nuevo sobre la misma rama cancela la corrida anterior: ahorra minutos y da feedback del
# último commit, que es el que importa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: athos-service (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: athos-service
    # Postgres con pgvector para los tests de integración. Existe porque los ÚNICOS tests de
    # aislamiento multi-tenant del sistema (test_cross_tenant.py) se auto-skipeaban sin DB — la
    # garantía que tres documentos citaban como "cubierta por test" no la ejecutaba nadie
    # (auditoría 2026-07-30). La secuencia shim → bootstrap → 0001-0003 está verificada contra
    # pgvector:pg16; los 2 golden (RUN_GOLDEN) y 2 de corpus poblado siguen skipeados a propósito.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: athos_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --dev
      - name: ruff
        run: uv run ruff check .
      - name: esquema de la DB de test (shim Supabase + bootstrap + 0001-0003)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d athos_test -v ON_ERROR_STOP=1 -q -f ../.github/ci/athos-db-shim.sql
          psql -h localhost -U postgres -d athos_test -v ON_ERROR_STOP=1 -q -f supabase/bootstrap/000_base_schema.sql
          psql -h localhost -U postgres -d athos_test -v ON_ERROR_STOP=1 -q -f supabase/migrations/0001_rag_corpus_glossary_trace.sql
          psql -h localhost -U postgres -d athos_test -v ON_ERROR_STOP=1 -q -f supabase/migrations/0002_vector_index_hnsw.sql
          psql -h localhost -U postgres -d athos_test -v ON_ERROR_STOP=1 -q -f supabase/migrations/0003_tier1_mesh_gin_index.sql
      - name: pytest
        env:
          # Con la DB del service los tests de integración (cross-tenant, gate desde DB, Tier 1)
          # CORREN en cada push en vez de auto-skipearse.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/athos_test
        run: uv run pytest -q

  frontend:
    name: front (typecheck + lint + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # OBLIGATORIO antes de tsc: `next-env.d.ts` está en .gitignore (convención de create-next-app),
      # y es lo que declara los módulos de imagen vía `next/image-types/global`. Sin él, `tsc` falla
      # con TS2307 en los 8 imports de `@/public/media/*.png` de la landing — pasa local (donde el
      # archivo existe porque ya corrió un build) y revienta en CI, que arranca limpio.
      # `typegen` genera esas definiciones sin pagar un build completo.
      - name: generar tipos de Next
        run: npx next typegen

      # Los cuatro gates van en orden de "más rápido en fallar" primero: si hay un error de tipos no
      # tiene sentido gastar 20 s en el build.
      #
      # typecheck y build NO estaban y son los que atajan lo que llega a producción: ni `lint` ni
      # `vitest` ven un template literal mal cerrado ni un import roto de una ruta de Next, y ambos
      # rompen el deploy. `tsc` corre sin emitir: solo valida.
      - name: typecheck
        run: npx tsc --noEmit

      - name: lint
        run: npm run lint

      - name: vitest
        run: npm test

      # El build de Next hace su propio chequeo de rutas y server/client boundaries. Es el último
      # gate antes de que Vercel construya lo mismo: si acá pasa, el deploy no se cae por compilación.
      - name: build
        run: npm run build
        env:
          # El build no necesita credenciales reales (no hay fetch en tiempo de build), pero las
          # rutas que instancian el cliente de Supabase esperan que las variables existan.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
