# El barrido diario de suscripciones: cobra lo que vence, reintenta lo que falló, baja lo cancelado.
#
# POR QUÉ ACÁ Y NO EN VERCEL: el plan Hobby permite 2 crons con disparo diario y los 2 cupos están
# usados (purge-audio y cartera). Mismo camino que `briefing-diario.yml` y `cartera-sweep.yml`.
#
# HORA: 13:00 UTC = 8:00 en Colombia. ANTES que el barrido de cartera (9:00), a propósito: si una
# clínica cae a free por falta de pago, conviene que caiga antes de que cartera intente usar la IA
# que esa clínica ya no tiene.
#
# CORRER DE MÁS ES INOFENSIVO: el barrido es idempotente por la referencia del cobro
# (`tuvetia-<clinica>-<YYYY-MM>-<intento>`), que es única en nuestra tabla Y en Wompi. Dos disparos
# el mismo día no cobran dos veces. Es la condición que hace que este cron pueda vivir en Actions,
# que no tiene SLA y a veces dispara tarde, dos veces, o no dispara.
#
# REQUIERE: el secreto CRON_SECRET en Settings → Secrets and variables → Actions, con el MISMO valor
# que la env de Vercel. Sin él el job falla con mensaje claro, no en silencio.
name: Renovación de suscripciones

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

concurrency:
  group: renovacion-suscripciones
  cancel-in-progress: false # un barrido que está cobrando se termina

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - name: cobrar las suscripciones que vencen hoy
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta el secreto CRON_SECRET en GitHub Actions (Settings → Secrets → Actions). Debe ser el mismo valor que la env de Vercel."
            exit 1
          fi
          # --fail-with-body: si el endpoint responde 4xx/5xx el job sale rojo Y muestra el cuerpo.
          # SIN --retry, a diferencia de los otros barridos. Un reintento de curl sobre un timeout
          # dispararía el barrido DE NUEVO sin saber si el primero llegó a cobrar. La idempotencia de
          # la referencia lo cubre, pero no hace falta ponerla a prueba todos los días: si una
          # corrida se pierde, la del día siguiente levanta lo mismo (el barrido compara con <=).
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://tuvetia.vercel.app/api/cron/suscripciones

      # Un schedule rojo no se lo muestra GitHub a nadie: mismo patrón que cartera-sweep.yml.
      - name: avisar si el barrido viene fallando
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Renovación de suscripciones fallando (schedule)"
          EXISTE=$(gh issue list --state open --search "$TITLE in:title" --json number --jq 'length')
          if [ "$EXISTE" = "0" ]; then
            gh issue create --title "$TITLE" \
              --body "El barrido diario de suscripciones falló. Nadie se está cobrando hasta que se arregle. Ver: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
